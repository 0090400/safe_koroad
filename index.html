<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoRoad 안전 알림판</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .gradient-bar { 
            transition: all 0.5s ease-in-out; 
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .highlight-ring { 
            animation: pulse-ring 1.8s infinite; 
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6 flex flex-col items-center justify-start">

    <div class="w-full max-w-2xl space-y-4">

        <!-- Header Bar -->
        <header class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 backdrop-blur-md shadow-xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        KoRoad 안전 알림판
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div title="10초 자동 갱신 카운트다운" class="hidden sm:flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-mono text-slate-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>자동 갱신 <strong id="refresh-timer-num" class="text-emerald-400 font-bold">10</strong>s</span>
                </div>
                <button onclick="toggleApiKeyModal()" title="공공데이터 API 인증키 설정" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700/50 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </button>
                <button onclick="requestLocation()" title="현재 GPS 위치 새로고침" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700/50 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-900/50 h-1 rounded-full overflow-hidden border border-slate-800">

        </div>

        <!-- Location & Selection Section -->

            </div>

                        <option value="">-- [2단계] 시험장 선택 --</option>
                    </select>
                </div>
            </div>
        </section>

                            <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="7" class="text-slate-800" fill="transparent" />

                                    stroke-dashoffset="198" 
                                    stroke-linecap="round" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">체감온도 (날씨누리)</span>

                                <span id="sensible-temp-val" class="text-3xl font-black transition-colors duration-500">--</span>

                            </div>

                    </div>
                    <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 flex items-center justify-between">
                        <span class="text-xs text-slate-400">💨 초미세먼지</span>
                        <div class="flex items-center gap-1.5">
                            <span id="pm25-val" class="text-sm font-bold text-white">-- ㎍/㎥</span>
                            <span id="pm25-badge" class="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-1.5 py-0.5 rounded font-semibold whitespace-nowrap">-</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Stage Range Cards -->
            <div class="space-y-3 pt-2 border-t border-slate-800/80">
                <div class="w-full h-3.5 bg-slate-950 rounded-full p-0.5 border border-slate-800 relative overflow-hidden">
                    <div id="gauge-bar-fill" class="h-full rounded-full bg-emerald-500 gradient-bar transition-all duration-700 ease-out" style="width: 0%;"></div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1 text-center">
                    <div id="zone-safe" class="bg-slate-950/80 border border-slate-800 rounded-xl p-2.5 transition-all">
                        <div class="text-xs font-bold text-emerald-400 flex items-center justify-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 관심/안전
                        </div>
                        <div class="text-xs font-bold text-slate-300 mt-1">31℃ 미만</div>
                    </div>
                    <div id="zone-attention" class="bg-slate-950/80 border border-slate-800 rounded-xl p-2.5 transition-all">
                        <div class="text-xs font-bold text-blue-400 flex items-center justify-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> 주의
                        </div>
                        <div class="text-xs font-bold text-slate-300 mt-1">31~33℃ 미만</div>
                    </div>
                    <div id="zone-caution" class="bg-slate-950/80 border border-slate-800 rounded-xl p-2.5 transition-all">
                        <div class="text-xs font-bold text-amber-400 flex items-center justify-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span> 경고
                        </div>
                        <div class="text-xs font-bold text-slate-300 mt-1">33~35℃ 미만</div>
                    </div>
                    <div id="zone-danger" class="bg-slate-950/80 border border-slate-800 rounded-xl p-2.5 transition-all">
                        <div class="text-xs font-bold text-rose-400 flex items-center justify-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-rose-500"></span> 위험
                        </div>
                        <div class="text-xs font-bold text-slate-300 mt-1">35℃ 이상</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Action Guidelines -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-lg space-y-3">
            <div class="flex items-center gap-2 border-b border-slate-800 pb-2.5">
                <div id="action-guideline-icon" class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30 text-xs font-bold">🛡️</div>
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    단계별 현장 안전 수칙 (<span id="action-guideline-stage" class="text-emerald-400">준비 중</span>)
                </h3>
            </div>
            <div id="action-guideline-box" class="space-y-2 text-xs leading-relaxed text-slate-300 pt-1">
            </div>
        </section>

    </div>

    <!-- API Key Modal -->
    <div id="api-key-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">🔑 공공데이터 OPEN API Key</h3>
                <button onclick="toggleApiKeyModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1">일반 API 인증키 (Encoding/Decoding)</label>
                    <input type="text" id="input-kma-key" placeholder="인증키 입력" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 font-mono">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="saveApiKeys()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl">저장 및 적용</button>
            </div>
        </div>
    </div>

                { name: "안산 운전면허시험장", lat: 37.3175, lng: 126.8123, areaNo: "4127300000", tmX: 183400, tmY: 424200 },
                { name: "의정부 운전면허시험장", lat: 37.7592, lng: 127.0685, areaNo: "4115000000", tmX: 206000, tmY: 473300 }

        const actionGuidelines = {

        let kmaServiceKey = localStorage.getItem('kma_service_key') || 'whIV7oO5m%2BRhIy4BFG6USPGsSzS7Zl5Jqi1%2B91H9khC%2FHmifFXLEZpCB6MOy5z4rCLWT7AqP2U%2F9yomgXX166w%3D%3D';
        let autoRefreshTimer = null;
        let countdownSeconds = 10;

        // 위경도 -> 기상청 Grid(nx, ny) 변환 함수
        function dfs_xy_conv(code, v1, v2) {
            const RE = 6371.00877, GRID = 5.0, SLAT1 = 30.0, SLAT2 = 60.0, OLON = 126.0, OLAT = 38.0, XO = 43, YO = 136;
            const DEGRAD = Math.PI / 180.0;
            const re = RE / GRID, slat1 = SLAT1 * DEGRAD, slat2 = SLAT2 * DEGRAD, olon = OLON * DEGRAD, olat = OLAT * DEGRAD;
            let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
            sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
            let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
            sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
            let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
            ro = re * sf / Math.pow(ro, sn);
            let rs = {};
            if (code === "toXY") {
                rs['lat'] = v1; rs['lng'] = v2;
                let ra = Math.tan(Math.PI * 0.25 + (v1) * DEGRAD * 0.5);
                ra = re * sf / Math.pow(ra, sn);
                let theta = v2 * DEGRAD - olon;
                if (theta > Math.PI) theta -= 2.0 * Math.PI;
                if (theta < -Math.PI) theta += 2.0 * Math.PI;
                theta *= sn;
                rs['nx'] = Math.floor(ra * Math.sin(theta) + XO + 0.5);
                rs['ny'] = Math.floor(ro - ra * Math.cos(theta) + YO + 0.5);
            }
            return rs;
        }

        window.onload = function() {
            const keyInput = document.getElementById('input-kma-key');
            if (keyInput && kmaServiceKey) keyInput.value = kmaServiceKey;
            requestLocation();
            startAutoRefreshLoop();
        };

        function startAutoRefreshLoop() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            countdownSeconds = 10;
            autoRefreshTimer = setInterval(() => {
                countdownSeconds--;
                const timerNum = document.getElementById('refresh-timer-num');
                const progressBar = document.getElementById('refresh-progress-bar');
                if (timerNum) timerNum.textContent = countdownSeconds;
                if (progressBar) progressBar.style.width = `${(countdownSeconds / 10) * 100}%`;
                if (countdownSeconds <= 0) {
                    countdownSeconds = 10;
                    fetchWeatherData(currentWeatherData.lat, currentWeatherData.lng, currentWeatherData.locationName);
                }
            }, 1000);
        }

        function toggleApiKeyModal() {
            const modal = document.getElementById('api-key-modal');
            if (modal) modal.classList.toggle('hidden');
        }

        function saveApiKeys() {
            const keyInput = document.getElementById('input-kma-key');
            if (keyInput) {
                kmaServiceKey = keyInput.value.trim();
                localStorage.setItem('kma_service_key', kmaServiceKey);
                toggleApiKeyModal();
                requestLocation();
            }
        }

        function requestLocation() {
            if (!navigator.geolocation) {
                document.getElementById('current-address').textContent = "권역 및 시험장을 선택해 주세요";
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    fetchWeatherData(pos.coords.latitude, pos.coords.longitude, "현재 위치 (GPS)");
                },
                () => {
                    document.getElementById('current-address').textContent = "권역 및 시험장을 선택해 주세요";
                },
                { timeout: 5000 }
            );
        }

        function onZoneChange(zone) {
            const centerSelect = document.getElementById('center-select');
            if (!centerSelect) return;
            centerSelect.innerHTML = '<option value="">-- [2단계] 시험장 선택 --</option>';
            if (!zone || !centerData[zone]) return;
            centerData[zone].forEach((center, idx) => {
                const opt = document.createElement('option');
                opt.value = `${zone}:${idx}`;
                opt.textContent = center.name;
                centerSelect.appendChild(opt);
            });
        }

        function onCenterSelect(val) {
            if (!val) return;
            const [zone, idx] = val.split(':');
            const center = centerData[zone][idx];
            if (center) fetchWeatherData(center.lat, center.lng, center.name, center);
        }

        async function fetchWeatherData(lat, lng, name, presetCenter = null) {
            currentWeatherData.locationName = name;
            currentWeatherData.lat = lat;
            currentWeatherData.lng = lng;

            document.getElementById('current-address').textContent = name;

            const grid = dfs_xy_conv("toXY", lat, lng);
            const decodedKey = decodeURIComponent(kmaServiceKey);

            if (presetCenter) {
                currentWeatherData.areaNo = presetCenter.areaNo;
                if (presetCenter.tmX) currentWeatherData.tmX = presetCenter.tmX;
                if (presetCenter.tmY) currentWeatherData.tmY = presetCenter.tmY;
            }

            // 1. [기상청 초단기실황 API - 실제 기온, 습도, 풍속]
            try {
                const now = new Date();
                const baseDate = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
                let hours = now.getHours();
                if (now.getMinutes() < 40) hours = hours - 1;
                if (hours < 0) hours = 23;
                const baseTime = `${String(hours).padStart(2, '0')}00`;

                const ncstUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?serviceKey=${encodeURIComponent(decodedKey)}&pageNo=1&numOfRows=10&dataType=JSON&base_date=${baseDate}&base_time=${baseTime}&nx=${grid.nx}&ny=${grid.ny}`;
                const ncstRes = await fetch(ncstUrl);
                if (ncstRes.ok) {
                    const ncstData = await ncstRes.json();
                    const items = ncstData?.response?.body?.items?.item;
                    if (items) {
                        items.forEach(item => {
                            if (item.category === 'T1H') currentWeatherData.temp = parseFloat(item.obsrValue);
                            if (item.category === 'REH') currentWeatherData.humidity = parseFloat(item.obsrValue);
                            if (item.category === 'WSD') currentWeatherData.wind = parseFloat(item.obsrValue);
                        });
                    }
                }
            } catch (e) {
                console.warn("기상청 초단기실황 조회 오류:", e);
            }

            // 2. [날씨누리 체감온도 API]
            try {
                const now = new Date();
                const timeStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}${String(now.getHours()).padStart(2, '0')}`;
                const sensibleUrl = `https://apis.data.go.kr/1360000/LivingWthrIdxServiceV4/getSensibleStrsIdxV4?serviceKey=${encodeURIComponent(decodedKey)}&dataType=JSON&areaNo=${currentWeatherData.areaNo}&time=${timeStr}`;
                const sensibleRes = await fetch(sensibleUrl);
                if (sensibleRes.ok) {
                    const sData = await sensibleRes.json();
                    const h0 = sData?.response?.body?.items?.item?.[0]?.h0;
                    if (h0) currentWeatherData.sensibleTemp = parseFloat(h0);
                }
            } catch (e) {
                console.warn("체감온도 수신 오류:", e);
            }

            // 3. [에어코리아 근접 측정소 및 실시간 대기오염 API]
            try {
                const stationUrl = `https://apis.data.go.kr/B552584/MsrstnInfoInqireSvc/getNearbyMsrstnList?serviceKey=${encodeURIComponent(decodedKey)}&returnType=json&tmX=${currentWeatherData.tmX}&tmY=${currentWeatherData.tmY}`;
                const stationRes = await fetch(stationUrl);
                if (stationRes.ok) {
                    const stData = await stationRes.json();
                    const stations = stData?.response?.body?.items;
                    if (stations && stations.length > 0) {
                        currentWeatherData.stationName = stations[0].stationName;
                    }
                }

                const airUrl = `https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?serviceKey=${encodeURIComponent(decodedKey)}&returnType=json&numOfRows=1&pageNo=1&stationName=${encodeURIComponent(currentWeatherData.stationName)}&dataTerm=DAILY&ver=1.3`;
                const airRes = await fetch(airUrl);
                if (airRes.ok) {
                    const airData = await airRes.json();
                    const item = airData?.response?.body?.items?.[0];
                    if (item) {
                        if (item.pm10Value && item.pm10Value !== '-') currentWeatherData.pm10 = parseInt(item.pm10Value, 10);
                        if (item.pm25Value && item.pm25Value !== '-') currentWeatherData.pm25 = parseInt(item.pm25Value, 10);
                    }
                }
            } catch (e) {
                console.warn("대기오염 정보 수신 오류:", e);
            }

            updateUI();
        }

        function getAirBadgeInfo(val, type) {
            if (type === 'pm10') {
                if (val <= 30) return { text: '좋음', cls: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' };
                if (val <= 80) return { text: '보통', cls: 'bg-blue-500/20 text-blue-400 border-blue-500/40' };
                if (val <= 150) return { text: '나쁨', cls: 'bg-amber-500/20 text-amber-400 border-amber-500/40' };
                return { text: '매우나쁨', cls: 'bg-rose-500/20 text-rose-400 border-rose-500/40' };
            } else {
                if (val <= 15) return { text: '좋음', cls: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' };
                if (val <= 35) return { text: '보통', cls: 'bg-blue-500/20 text-blue-400 border-blue-500/40' };
                if (val <= 75) return { text: '나쁨', cls: 'bg-amber-500/20 text-amber-400 border-amber-500/40' };
                return { text: '매우나쁨', cls: 'bg-rose-500/20 text-rose-400 border-rose-500/40' };
            }
        }

        function updateUI() {
            const st = currentWeatherData.sensibleTemp || currentWeatherData.temp;
            
            document.getElementById('actual-temp-val').textContent = `${currentWeatherData.temp.toFixed(1)} °C`;
            document.getElementById('humidity-val').textContent = `${Math.round(currentWeatherData.humidity)} %`;
            document.getElementById('wind-val').textContent = `${currentWeatherData.wind.toFixed(1)} m/s`;
            
            document.getElementById('pm10-val').textContent = `${currentWeatherData.pm10} ㎍/㎥`;
            document.getElementById('pm25-val').textContent = `${currentWeatherData.pm25} ㎍/㎥`;
            
            const pm10B = getAirBadgeInfo(currentWeatherData.pm10, 'pm10');
            const pm25B = getAirBadgeInfo(currentWeatherData.pm25, 'pm25');
            
            const p10El = document.getElementById('pm10-badge');
            p10El.textContent = pm10B.text;
            p10El.className = `text-[10px] border px-1.5 py-0.5 rounded font-semibold whitespace-nowrap ${pm10B.cls}`;
            
            const p25El = document.getElementById('pm25-badge');
            p25El.textContent = pm25B.text;
            p25El.className = `text-[10px] border px-1.5 py-0.5 rounded font-semibold whitespace-nowrap ${pm25B.cls}`;

            document.getElementById('station-name-label').textContent = `(${currentWeatherData.stationName})`;

            let statusText = "안전", hexColor = "#10b981", gaugePercent = 25, stageKey = "safe";
            if (st < 31) {
                statusText = "관심/안전"; hexColor = "#10b981"; gaugePercent = Math.min(25, Math.max(5, (st / 31) * 25)); stageKey = "safe";
            } else if (st < 33) {
                statusText = "주의"; hexColor = "#3b82f6"; gaugePercent = 25 + ((st - 31) / 2) * 25; stageKey = "attention";
            } else if (st < 35) {
                statusText = "경고"; hexColor = "#f59e0b"; gaugePercent = 50 + ((st - 33) / 2) * 25; stageKey = "caution";
            } else {
                statusText = "위험"; hexColor = "#f43f5e"; gaugePercent = Math.min(100, 75 + ((st - 35) / 5) * 25); stageKey = "danger";
            }

            const sensibleVal = document.getElementById('sensible-temp-val');
            if (sensibleVal) {
                sensibleVal.textContent = st.toFixed(1);
                sensibleVal.style.color = hexColor;
            }

            document.getElementById('status-badge-text').textContent = statusText;
            document.getElementById('status-badge-dot').style.backgroundColor = hexColor;

            const circleFill = document.getElementById('dial-circle-fill');
            if (circleFill) {
                circleFill.style.strokeDashoffset = 263.89 - (gaugePercent / 100) * 263.89;
                circleFill.style.stroke = hexColor;
            }

            const barFill = document.getElementById('gauge-bar-fill');
            if (barFill) {
                barFill.style.width = `${gaugePercent}%`;
                barFill.style.backgroundColor = hexColor;
            }

            updateActionGuidelines(stageKey);
        }

        function updateActionGuidelines(stageKey) {
            const guideline = actionGuidelines[stageKey] || actionGuidelines.safe;
            document.getElementById('action-guideline-stage').textContent = guideline.stage;
            document.getElementById('action-guideline-stage').style.color = guideline.color;
            document.getElementById('action-guideline-box').innerHTML = guideline.items.map(item => `
                <div class="bg-slate-950/80 rounded-xl p-3 border border-slate-800/80 flex items-start gap-2.5">
                    <span class="text-xs mt-0.5">•</span>
                    <p class="text-slate-300 text-xs leading-relaxed">${item}</p>
                </div>
            `).join('');
        }
    </script>
</body>
