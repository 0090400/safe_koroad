<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoRoad 안전 알림판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 좌표 변환 라이브러리 (GPS -> TM 변환용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; }
        .gradient-bar { transition: all 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6 flex flex-col items-center justify-start">

    <div class="w-full max-w-2xl space-y-4">
        <!-- Header -->
        <header class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 md:p-5 backdrop-blur-md shadow-xl flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0 flex-shrink">
                <div id="app-logo-bg" class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-gradient-to-br from-cyan-600 to-blue-600 flex-shrink-0 flex items-center justify-center text-white shadow-md transition-colors">
                    <span id="app-logo-icon" class="text-lg md:text-xl">❄️</span>
                </div>
                <div class="min-w-0">
                    <h1 class="text-[15px] sm:text-xl font-bold text-white truncate leading-tight">
                        KoRoad 안전 알림판
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-shrink-0">
                <!-- 계절 선택 모드 스위치 -->
                <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center gap-1">
                    <button id="btn-mode-winter" onclick="setSeasonMode('winter')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 text-cyan-300 bg-cyan-950/80 border border-cyan-800/80">
                        ❄️ 겨울
                    </button>
                    <button id="btn-mode-summer" onclick="setSeasonMode('summer')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 text-slate-400 hover:text-slate-200">
                        ☀️ 여름
                    </button>
                </div>

                <button onclick="requestLocation()" title="현재 위치 새로고침" class="p-2.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700/50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Location Selection -->
        <section class="bg-slate-900/80 border border-slate-800/90 rounded-2xl p-4 shadow-lg space-y-3">
            <h2 id="current-address" class="text-base md:text-lg font-bold text-white tracking-tight flex items-center gap-2">
                <span class="text-blue-400">📍</span> GPS 위치 탐색 중...
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                <select id="region-zone-select" onchange="onZoneChange(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-3 text-xs text-slate-200 outline-none focus:border-slate-600">
                    <option value="">-- [1단계] 권역 선택 --</option>
                    <option value="seoul_gyeonggi_incheon">1. 서울 · 경기 · 인천</option>
                    <option value="busan_gyeongsang">2. 부산 · 경상</option>
                    <option value="daejeon_chungcheong">3. 대전 · 충청</option>
                    <option value="gwangju_jeolla">4. 광주 · 전라</option>
                    <option value="gangwon_jeju">5. 강원 · 제주</option>
                </select>
                <select id="center-select" onchange="onCenterSelect(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-3 text-xs text-slate-200 outline-none focus:border-slate-600">
                    <option value="">-- [2단계] 시험장 선택 --</option>
                </select>
            </div>
        </section>

        <!-- Weather Overview -->
        <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                <!-- Left: Actual Weather -->
                <div class="space-y-2 order-2 md:order-1">
                    <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 flex justify-between text-sm">
                        <span class="text-slate-400 text-xs">🌡️ 현재 기온</span>
                        <span id="actual-temp-val" class="font-bold text-white">-- °C</span>
                    </div>
                    <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 flex justify-between text-sm">
                        <span class="text-slate-400 text-xs">💧 습도</span>
                        <span id="humidity-val" class="font-bold text-white">-- %</span>
                    </div>
                    <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80
